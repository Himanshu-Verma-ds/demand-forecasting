project:
  name: fmcg_demand_forecasting
  random_seed: 42
logging:
  dir: _audit/logs
  level: INFO
  console: false
  backup_count: 14
  utc: false
data:
  raw_path: _audit/data.csv
  date_col: date
  target_col: units_sold
  series_cols:
  - store_id
  - sku_id
  horizon: 14
  lookback: 56
split:
  validation_days: 14
  test_days: 14
features:
  demand_lags:
  - 1
  - 7
  - 14
  - 28
  demand_roll_windows:
  - 7
  - 14
  - 28
  stock_roll_window: 28
  stockout_target_mode: none
  stockout_imputation_window: 56
  stockout_imputation_min_periods: 7
  stockout_percentage_uplift: 0.5
  stockout_sample_weight: 0.5
  stockout_lags:
  - 1
  - 7
  - 14
  promo_known_future: true
  price_known_future: false
  weather_known_future: false
training:
  max_train_rows: null
  n_jobs: -1
  mlflow_experiment: audit-smoke
  save_dir: _audit/artifacts
bayes:
  n_trials: 2
  timeout_seconds: null
  tuning_models:
  - lightgbm
  - xgboost
  - catboost
ml:
  models:
  - lightgbm
  - xgboost
  - catboost
dl:
  batch_size: 256
  epochs: 2
  patience: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  hidden_size: 128
  embedding_dim: 16
  num_layers: 2
  dropout: 0.15
  transformer_d_model: 128
  transformer_heads: 4
  transformer_layers: 3
  num_workers: 0
hierarchy:
  share_window_days: 56
  share_target_col: units_sold
  exclude_stockouts_for_shares: true
monitoring:
  psi_warning: 0.1
  psi_alert: 0.25
  promo_rate_relative_change_alert: 0.3
